<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สมัครสมาชิก — CV-Screener</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--surface:#f7f7f8;--border:#e7e7ea;
  --ink:#18181b;--sub:#71717a;--faint:#a1a1aa;
  --accent:#4338ca;--accent-soft:#eef0fd;
  --red:#dc2626;--red-soft:#fdeded;
  --radius:14px;--radius-sm:9px;
}
body{font-family:'Noto Sans Thai','Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

nav{border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;background:#c22731}
.logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:#fff}
.logo img{height:36px;width:auto;object-fit:contain}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px}
.card-title{font-size:22px;font-weight:700;margin-bottom:4px}
.card-sub{font-size:13px;color:var(--sub);margin-bottom:28px}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:12px;font-weight:600;color:var(--ink)}
.field-hint{font-size:11px;color:var(--faint)}
input[type=text],input[type=email],input[type=password]{
  width:100%;padding:10px 12px;background:#fff;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--ink);font-size:13px;font-family:'Noto Sans Thai','Inter',sans-serif;
  outline:none;transition:border-color .15s
}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--faint)}

.btn{width:100%;padding:13px;background:var(--ink);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:8px;font-family:'Noto Sans Thai','Inter',sans-serif}
.btn:hover{background:var(--accent)}

.error-box{background:var(--red-soft);border:1px solid #fad4d4;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:16px}

.footer-link{text-align:center;margin-top:20px;font-size:13px;color:var(--sub)}
.footer-link a{color:var(--accent);text-decoration:none;font-weight:500}
.footer-link a:hover{text-decoration:underline}
</style>
</head>
<body>

<nav>
  <div class="logo">
    <img src="/static/SSI-Group-logo-transparent.png" onerror="this.style.display='none'">
    CV-Screener
  </div>
</nav>

<main>
  <div class="card">
    <div class="card-title">สมัครสมาชิก</div>
    <div class="card-sub">สร้างบัญชีเพื่อใช้งาน CV-Screener</div>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="อย่างน้อย 3 ตัวอักษร" required autofocus>
        <span class="field-hint">ใช้ภาษาอังกฤษ ตัวเลข หรือ _</span>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" placeholder="example@email.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="อย่างน้อย 6 ตัวอักษร" required>
      </div>
      <div class="field">
        <label>ยืนยัน Password</label>
        <input type="password" name="password2" placeholder="กรอก Password อีกครั้ง" required>
      </div>
      <button type="submit" class="btn">สมัครสมาชิก</button>
    </form>

    <div class="footer-link">
      มีบัญชีแล้ว? <a href="/login">เข้าสู่ระบบ</a>
    </div>
  </div>
</main>

</body>
</html>
